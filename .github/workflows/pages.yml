name: Validate and Deploy Static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate static Mini App
        shell: bash
        run: |
          node --check app.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = process.cwd();
          const pdfPath = path.join(root, 'assets', 'MonetizaBOOK_Duvidas_Frequentes_Premium_2026.pdf');
          const requiredFiles = ['index.html', 'app.js', 'styles.css', '.nojekyll', 'assets/MonetizaBOOK_Duvidas_Frequentes_Premium_2026.pdf'];

          for (const file of requiredFiles) {
            if (!fs.existsSync(path.join(root, file))) {
              throw new Error(`Missing required file: ${file}`);
            }
          }

          const indexHtml = fs.readFileSync(path.join(root, 'index.html'), 'utf8');
          const appJs = fs.readFileSync(path.join(root, 'app.js'), 'utf8');
          const pdf = fs.readFileSync(pdfPath);

          if (!indexHtml.includes('<script type="module" src="app.js"></script>')) {
            throw new Error('index.html does not load app.js as a module');
          }

          if (/pdf-data-\d{2}\.js/.test(indexHtml) || indexHtml.includes('pdf-bootstrap.js')) {
            throw new Error('index.html still references Base64 PDF bootstrap files');
          }

          if (appJs.includes('MONETIZABOOK_PDF_BYTES') || appJs.includes('MONETIZABOOK_PDF_PARTS')) {
            throw new Error('app.js still depends on Base64 PDF globals');
          }

          if (!appJs.includes('assets/MonetizaBOOK_Duvidas_Frequentes_Premium_2026.pdf')) {
            throw new Error('app.js is not pointed to the uploaded real PDF asset path');
          }

          if (pdf.length < 1024) throw new Error('PDF file is unexpectedly small');
          if (pdf.subarray(0, 5).toString('ascii') !== '%PDF-') {
            throw new Error('Configured asset exists but is not a real PDF file');
          }

          console.log(`Real PDF asset found and validated: ${path.relative(root, pdfPath)} (${pdf.length} bytes)`);
          console.log('Static Mini App validation completed without Base64 PDF reconstruction.');
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
