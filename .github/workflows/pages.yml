name: Validate and Deploy Static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate current static source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const requiredFiles = [
            'index.html',
            'duvidas-frequentes.html',
            'biblioteca/index.html',
            'biblioteca/reader.css',
            'biblioteca/reader.js',
            'robots.txt',
            'sitemap.xml',
            'assets/monetizabook-social-1200x630.jpg',
            'assets/monetizabook-social-share.jpg'
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`Missing required file: ${file}`);
          }

          const home = fs.readFileSync('index.html', 'utf8');
          const faq = fs.readFileSync('duvidas-frequentes.html', 'utf8');
          const library = fs.readFileSync('biblioteca/index.html', 'utf8');
          const robots = fs.readFileSync('robots.txt', 'utf8');
          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');

          const requiredHome = [
            'href="biblioteca/index.html"',
            'href="duvidas-frequentes.html"',
            'Participar gratuitamente',
            'id="beneficios"',
            'id="perfil"',
            'rel="canonical" href="https://sistemacodigolucrativo.github.io/MonetizaBOOK/"',
            'property="og:title"',
            'property="og:image"',
            'assets/monetizabook-social-share.jpg',
            'name="twitter:card"',
            'application/ld+json'
          ];
          for (const token of requiredHome) {
            if (!home.includes(token)) throw new Error(`Home missing: ${token}`);
          }

          const requiredFaq = [
            'id="faq"',
            'id="sobre"',
            'id="participacao"',
            'id="equipe"'
          ];
          for (const token of requiredFaq) {
            if (!faq.includes(token)) throw new Error(`FAQ missing: ${token}`);
          }

          const questions = (faq.match(/<details>/g) || []).length;
          if (questions < 50) throw new Error(`Expected at least 50 FAQ entries, found ${questions}`);

          const volumes = (library.match(/data-volume=/g) || []).length;
          if (volumes < 10) throw new Error(`Expected 10 library volumes, found ${volumes}`);

          const expectedBase = 'https://sistemacodigolucrativo.github.io/MonetizaBOOK/';
          if (!faq.includes(`rel="canonical" href="${expectedBase}duvidas-frequentes.html"`)) throw new Error('FAQ canonical missing or incorrect');
          if (!library.includes(`rel="canonical" href="${expectedBase}biblioteca/"`)) throw new Error('Library canonical missing or incorrect');
          if (!robots.includes(`Sitemap: ${expectedBase}sitemap.xml`)) throw new Error('robots.txt sitemap declaration missing');
          const sitemapLocations = (sitemap.match(/<loc>/g) || []).length;
          if (sitemapLocations !== 22) throw new Error(`Expected 22 sitemap URLs, found ${sitemapLocations}`);
          for (let i = 1; i <= 10; i += 1) {
            const n = String(i).padStart(2, '0');
            const volumeHtml = fs.readFileSync(`biblioteca/volumes/${n}/index.html`, 'utf8');
            if (!volumeHtml.includes(`rel="canonical" href="${expectedBase}biblioteca/volumes/${n}/"`)) throw new Error(`Volume ${n} canonical missing`);
            if (!volumeHtml.includes('property="og:image"') || !volumeHtml.includes('name="twitter:card"')) throw new Error(`Volume ${n} social metadata missing`);
          }
          for (const page of [home, faq, library]) {
            const marker = '<script type="application/ld+json">';
            const first = page.indexOf(marker);
            const second = first >= 0 ? page.indexOf(marker, first + marker.length) : -1;
            if (first < 0 || second >= 0) throw new Error('Expected one JSON-LD block on each primary page');
            const end = page.indexOf('</script>', first + marker.length);
            if (end < 0) throw new Error('JSON-LD closing tag missing');
            JSON.parse(page.slice(first + marker.length, end));
          }
          console.log(`Validated structure, SEO metadata, JSON-LD, sitemap (${sitemapLocations} URLs), FAQ (${questions}) and library (${volumes}).`);
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
