name: Validate and Deploy Static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate standalone HTML Mini App
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const required = [
            '<!doctype html>',
            'id="gerais"',
            'id="colaborativas"',
            'id="colaboradores"',
            'id="fontes"',
            'id="creditos"',
            'Marcelo R. Souza',
            'CEO - Método Código Lucrativo &amp; MonetizaBOOK Engajament'
          ];
          for (const token of required) {
            if (!html.toLowerCase().includes(token.toLowerCase())) throw new Error(`Missing required HTML content: ${token}`);
          }
          if (/pdf-bootstrap\.js|pdf-data-\d+\.js|data-pdf-src|pdf\.js/i.test(html)) {
            throw new Error('index.html still depends on the legacy PDF reader/reconstruction architecture');
          }
          const ids = new Set([...html.matchAll(/\sid="([^"]+)"/g)].map(m => m[1]));
          const internalLinks = [...html.matchAll(/href="#([^"]+)"/g)].map(m => m[1]).filter(Boolean);
          const broken = [...new Set(internalLinks.filter(id => !ids.has(id)))];
          if (broken.length) throw new Error(`Broken internal anchors: ${broken.join(', ')}`);
          const details = (html.match(/<details>/g) || []).length;
          if (details < 100) throw new Error(`FAQ appears incomplete: expected at least 100 interactive entries, found ${details}`);
          console.log(`Standalone HTML validated: ${details} interactive entries; ${internalLinks.length} internal links; no PDF dependency.`);
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
