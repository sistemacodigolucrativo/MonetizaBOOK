name: Validate and Deploy Static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate current static source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const requiredFiles = [
            'index.html',
            'duvidas-frequentes.html',
            'biblioteca/index.html',
            'biblioteca/reader.css',
            'biblioteca/reader.js'
          ];

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`Missing required file: ${file}`);
          }

          const home = fs.readFileSync('index.html', 'utf8');
          const faq = fs.readFileSync('duvidas-frequentes.html', 'utf8');
          const library = fs.readFileSync('biblioteca/index.html', 'utf8');

          const requiredHome = [
            'href="biblioteca/index.html"',
            'href="duvidas-frequentes.html"',
            'Participar gratuitamente',
            'id="beneficios"',
            'id="perfil"'
          ];
          for (const token of requiredHome) {
            if (!home.includes(token)) throw new Error(`Home missing: ${token}`);
          }

          const requiredFaq = [
            'id="faq"',
            'id="sobre"',
            'id="participacao"',
            'id="equipe"'
          ];
          for (const token of requiredFaq) {
            if (!faq.includes(token)) throw new Error(`FAQ missing: ${token}`);
          }

          const questions = (faq.match(/<details>/g) || []).length;
          if (questions < 50) throw new Error(`Expected at least 50 FAQ entries, found ${questions}`);

          const volumes = (library.match(/data-volume=/g) || []).length;
          if (volumes < 10) throw new Error(`Expected 10 library volumes, found ${volumes}`);

          console.log(`Validated current home, dedicated FAQ (${questions} entries) and library (${volumes} volumes).`);
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
