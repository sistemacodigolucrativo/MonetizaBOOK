name: Validate and Deploy Static Mini App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate source structure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const faqSource = fs.readFileSync('faq-source.html', 'utf8');
          const home = fs.readFileSync('index.html', 'utf8');

          const requiredFaq = [
            'id="faq"',
            'id="gerais"',
            'id="colaborativas"',
            'id="colaboradores"',
            'id="creditos"',
            'Marcelo R. Souza'
          ];
          for (const token of requiredFaq) {
            if (!faqSource.includes(token)) throw new Error(`FAQ source missing: ${token}`);
          }

          if (/Adobe Acrobat|Adobe Reader/i.test(faqSource)) {
            throw new Error('Obsolete Adobe/PDF reader reference remains in FAQ source');
          }

          const questions = (faqSource.match(/<details>/g) || []).length;
          if (questions < 100) {
            throw new Error(`Expected at least 100 FAQ entries, found ${questions}`);
          }

          const requiredHome = [
            'href="biblioteca/"',
            'href="duvidas-frequentes.html"',
            'id="como-funciona"',
            'Marcelo R. Souza'
          ];
          for (const token of requiredHome) {
            if (!home.includes(token)) throw new Error(`Home missing: ${token}`);
          }

          for (const path of [
            'biblioteca.html',
            'biblioteca/index.html',
            'biblioteca/reader.css',
            'biblioteca/reader.js'
          ]) {
            if (!fs.existsSync(path)) throw new Error(`Missing library file: ${path}`);
          }

          console.log(`Validated home, library and ${questions} FAQ entries.`);
          NODE

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build objective home and dedicated FAQ
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const source = fs.readFileSync('faq-source.html', 'utf8');
          const style = (source.match(/<style>([\s\S]*?)<\/style>/i) || [,''])[1];

          const faqStart = source.search(/<section\b[^>]*\bid=["']faq["'][^>]*>/i);
          const creditsStart = source.search(/<section\b[^>]*\bid=["']creditos["'][^>]*>/i);

          if (faqStart < 0 || creditsStart < 0 || creditsStart <= faqStart) {
            throw new Error(`FAQ or credits boundary not found: faq=${faqStart}, credits=${creditsStart}`);
          }

          const faq = source.slice(faqStart, creditsStart);

          const afterCredits = source.slice(creditsStart);
          const creditsMatch = afterCredits.match(/^<section\b[^>]*\bid=["']creditos["'][^>]*>[\s\S]*?<\/section>/i);
          const credits = creditsMatch ? creditsMatch[0] : '';

          if (!credits) throw new Error('Credits section could not be extracted');

          const faqPage = `<!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <meta name="theme-color" content="#07162d">
            <title>MonetizaBOOK — Dúvidas Frequentes</title>
            <meta name="description" content="Central de dúvidas do MonetizaBOOK para membros, colaboradores e operação da comunidade.">
            <style>${style}
              .faq-intro{background:linear-gradient(145deg,#07162d,#0b2b55);color:#fff;padding:54px 0 42px}
              .faq-intro h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:10px 0 12px}
              .faq-intro p{color:#d8e7f7;max-width:760px}
              .faq-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
              .faq-page #faq{padding-top:48px}
              @media(max-width:560px){.faq-actions{display:grid}.faq-actions .btn{width:100%}}
            </style>
          </head>
          <body id="top" class="faq-page">
            <header class="top">
              <div class="wrap">
                <div class="brand"><small>CENTRAL DE CONHECIMENTO</small>MONETIZABOOK</div>
                <nav class="nav">
                  <a href="index.html">Início</a>
                  <a href="biblioteca/">Biblioteca</a>
                  <a class="btn" href="index.html">Voltar</a>
                </nav>
              </div>
            </header>
            <main>
              <section class="faq-intro">
                <div class="wrap">
                  <span class="eyebrow">CENTRAL DE AJUDA</span>
                  <h1>Dúvidas Frequentes</h1>
                  <p>Pesquise dúvidas sobre funcionamento, regras, colaboração, segurança, conteúdo e monetização.</p>
                  <div class="faq-actions">
                    <a class="btn" href="biblioteca/">Acessar biblioteca</a>
                    <a class="btn ghost" href="index.html">Página inicial</a>
                  </div>
                </div>
              </section>
              ${faq}
            </main>
            ${credits}
            <script>
              const q=document.getElementById('faqSearch');
              if(q) q.addEventListener('input',()=>{
                const t=q.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
                document.querySelectorAll('#faq details').forEach(d=>{
                  const s=d.innerText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
                  d.classList.toggle('hide',t&&!s.includes(t));
                });
              });
            </script>
          </body>
          </html>`;

          fs.writeFileSync('duvidas-frequentes.html', faqPage);

          const builtHome = fs.readFileSync('index.html', 'utf8');
          const builtFaq = fs.readFileSync('duvidas-frequentes.html', 'utf8');

          if (!builtHome.includes('href="biblioteca/"')) throw new Error('Home does not link to library');
          if (!builtHome.includes('href="duvidas-frequentes.html"')) throw new Error('Home does not link to FAQ');
          if ((builtFaq.match(/<details>/g) || []).length < 100) throw new Error('Dedicated FAQ lost entries');
          if (/Adobe Acrobat|Adobe Reader/i.test(builtFaq)) throw new Error('Obsolete Adobe/PDF reader reference reached built FAQ');

          console.log('Built objective home + dedicated FAQ successfully.');
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
