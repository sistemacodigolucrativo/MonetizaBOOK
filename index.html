<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1730">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="MonetizaBOOK - Dúvidas Frequentes. Leitor oficial do e-book em PDF.">
  <title>MonetizaBOOK - Dúvidas Frequentes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-kicker">MONETIZABOOK</span>
      <strong>Dúvidas Frequentes</strong>
    </div>
    <div class="header-actions">
      <button id="tocButton" class="icon-button" type="button" aria-label="Abrir índice" title="Índice">☰</button>
      <a class="icon-button" href="#" data-pdf-download aria-disabled="true" aria-label="Baixar PDF" title="Baixar PDF">↓</a>
    </div>
  </header>

  <main
    id="reader"
    class="reader"
    aria-live="polite"
    data-pdf-src=""
    data-pdf-filename="MonetizaBOOK_Duvidas_Frequentes_Premium_2026-2.pdf"
  >
    <div id="pageViewport" class="page-viewport">
      <div id="pageShell" class="page-shell">
        <canvas id="pageCanvas" aria-label="Página do e-book MonetizaBOOK"></canvas>
        <div id="linkLayer" class="link-layer" aria-label="Links da página"></div>
        <div id="loading" class="loading" role="status">Preparando leitor do e-book…</div>
        <div id="loadError" class="load-error" hidden>
          <strong id="loadErrorTitle">PDF ainda não configurado.</strong>
          <p id="loadErrorMessage">Envie o arquivo PDF real para o repositório. Depois disso, esta tela será conectada ao arquivo sem conversão para Base64.</p>
          <a href="#" data-pdf-open aria-disabled="true">Abrir o PDF diretamente</a>
        </div>
      </div>
    </div>
  </main>

  <nav class="toolbar" aria-label="Controles do leitor">
    <button id="prevButton" type="button" aria-label="Página anterior">‹</button>
    <button id="pageButton" class="page-indicator" type="button" aria-label="Ir para uma página">
      <span id="pageCurrent">1</span><span class="separator">/</span><span id="pageTotal">27</span>
    </button>
    <button id="nextButton" type="button" aria-label="Próxima página">›</button>
    <span class="toolbar-divider"></span>
    <button id="zoomOut" type="button" aria-label="Diminuir zoom">−</button>
    <button id="zoomReset" class="zoom-label" type="button" aria-label="Restaurar zoom">100%</button>
    <button id="zoomIn" type="button" aria-label="Aumentar zoom">+</button>
  </nav>

  <div id="scrim" class="scrim" hidden></div>
  <aside id="tocPanel" class="toc-panel" aria-hidden="true" aria-label="Índice do e-book">
    <div class="toc-header">
      <div>
        <span class="brand-kicker">NAVEGAÇÃO</span>
        <h2>Índice</h2>
      </div>
      <button id="tocClose" class="icon-button" type="button" aria-label="Fechar índice">×</button>
    </div>
    <div class="toc-shortcuts">
      <button data-page="3">Índice principal</button>
      <button data-page="4">Dúvidas gerais</button>
      <button data-page="15">Dúvidas colaborativas</button>
      <button data-page="26">Fontes</button>
    </div>
    <div class="toc-search-wrap">
      <label class="sr-only" for="tocSearch">Pesquisar no índice</label>
      <input id="tocSearch" type="search" inputmode="search" placeholder="Pesquisar uma pergunta…" autocomplete="off">
    </div>
    <div id="tocList" class="toc-list"></div>
    <div class="toc-footer">
      <a href="#" data-pdf-download aria-disabled="true">Baixar PDF revisado</a>
    </div>
  </aside>

  <dialog id="pageDialog" class="page-dialog">
    <form method="dialog" id="pageForm">
      <label for="pageInput">Ir para a página</label>
      <div class="page-dialog-row">
        <input id="pageInput" type="number" min="1" max="27" inputmode="numeric" required>
        <button value="confirm" type="submit">Ir</button>
      </div>
      <button class="dialog-cancel" value="cancel" type="submit">Cancelar</button>
    </form>
  </dialog>

  <noscript>
    <p class="noscript">Este leitor requer JavaScript para carregar e exibir o PDF.</p>
  </noscript>

  <script type="module" src="app.js"></script>
</body>
</html>
